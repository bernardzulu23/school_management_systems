# Dependabot — ZSMS (Phase 9)
#
# Opens update PRs on a weekly schedule. Patch-only PRs may auto-merge via
# `.github/workflows/dependabot-auto-merge.yml` after required checks pass.
# Minor/major still need human review (minors are grouped to reduce noise).
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Africa/Lusaka'
    open-pull-requests-limit: 12
    labels:
      - 'dependencies'
    # Patches stay ungrouped so Dependabot metadata reports semver-patch
    # (required for safe auto-merge). Minors are grouped for review batches.
    groups:
      npm-minor-updates:
        update-types:
          - 'minor'

  - package-ecosystem: 'npm'
    directory: '/zsms-mobile'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Africa/Lusaka'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'mobile'
    groups:
      mobile-minor-updates:
        update-types:
          - 'minor'

  - package-ecosystem: 'pip'
    directory: '/services/timetable-solver'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'solver-service'

  - package-ecosystem: 'pip'
    directory: '/solver-service'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'solver-service'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'ci'
