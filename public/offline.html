<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
    <title>Offline - ZSMS</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #F5F2ED;
        color: #1A1A1A;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        padding: 2rem;
        text-align: center;
        background: #fff;
        border-radius: 0.75rem;
        border: 2px solid #1A1A1A;
        box-shadow: 4px 4px 0 #1A1A1A;
      }
      .icon-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 1.5rem;
      }
      .icon-wrap img {
        width: 64px;
        height: 64px;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
        color: #1A1A1A;
      }
      p {
        margin: 0 0 2rem;
        line-height: 1.5;
        color: #4A4A4A;
      }
      button, .btn {
        display: inline-block;
        width: 100%;
        padding: 0.75rem 1.5rem;
        border: 2px solid #1A1A1A;
        border-radius: 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: #FF3B00;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
      }
      button:hover, .btn:hover { background: #E03500; }
      button:focus-visible, .btn:focus-visible {
        outline: 2px solid #C99A2E;
        outline-offset: 2px;
      }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <img src="/icons/zsms-mark.svg" width="64" height="64" alt="ZSMS" />
        </div>
        <h1>You're Currently Offline</h1>
        <p>It looks like your internet connection is unstable. Some features may be limited, but you can still access cached data.</p>
        <a href="." class="btn" role="button">Retry Connection</a>
    </div>
</body>
</html>
